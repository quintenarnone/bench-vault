[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchvault"
version = "0.3.0"
description = "Local-first electronics inventory and workshop manager for Linux"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7", "qrcode[pil]>=7.4"]

[project.scripts]
benchvault = "benchvault.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchvault*"]
